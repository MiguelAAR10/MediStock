services:
  postgres:
    image: postgres:15-alpine
    container_name: medistock_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medistock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-medistock}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - medistock_pgdata:/var/lib/postgresql/data
      - ./src/sql/schema:/docker-entrypoint-initdb.d/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medistock} -d ${POSTGRES_DB:-medistock}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: ops/docker/backend.Dockerfile
    container_name: medistock_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medistock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-medistock}
      FLASK_ENV: ${FLASK_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      API_HOST: 0.0.0.0
      API_PORT: "5000"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - .:/app
    command: python src/clinica_backend/run.py

  frontend:
    build:
      context: .
      dockerfile: ops/docker/frontend.Dockerfile
    container_name: medistock_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      API_BASE_URL: http://backend:5000/api/v1
      REQUEST_TIMEOUT: "10"
      DEBUG_MODE: "false"
      PAGE_TITLE: MediStock
      PAGE_ICON: ":hospital:"
      LAYOUT: wide
    ports:
      - "${STREAMLIT_SERVER_PORT:-8501}:8501"
    volumes:
      - ./src/clinica_frontend:/app/src/clinica_frontend
    command: streamlit run src/clinica_frontend/app.py --server.port=8501 --server.address=0.0.0.0

  olap-refresh:
    build:
      context: .
      dockerfile: ops/docker/backend.Dockerfile
    container_name: medistock_olap_refresh
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medistock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-medistock}
    volumes:
      - .:/app
    command: >
      sh -c "
        echo 'Initial OLAP bootstrap...' &&
        python src/jobs/setup_olap.py &&
        echo 'Starting OLAP refresh loop (24h cycle)...' &&
        while true; do
          python src/jobs/run_olap_cycle.py || echo 'OLAP cycle failed, will retry';
          sleep 86400;
        done
      "
    restart: unless-stopped

volumes:
  medistock_pgdata:
    driver: local
